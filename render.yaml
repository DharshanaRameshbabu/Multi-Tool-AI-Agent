services:
  - type: web
    name: multi-tool-ai-agent-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python run.py backend --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: LLM_PROVIDER
        sync: false

  - type: web
    name: multi-tool-ai-agent-frontend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run frontend/app.py --server.port $PORT --server.address 0.0.0.0
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
